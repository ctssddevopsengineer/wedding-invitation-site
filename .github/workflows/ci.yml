name: CI

on:
  pull_request:
    branches:
      - development
      - master
      - release/**
  push:
    branches:
      - development
      - master
      - release/**

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  set-environment:
    runs-on: ubuntu-latest

    outputs:
      environment: ${{ steps.environment.outputs.environment }}

    steps:
      - name: Determine target environment
        id: environment
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH="${{ github.base_ref }}"
          else
            BRANCH="${{ github.ref_name }}"
          fi

          case "$BRANCH" in
            development)
              ENVIRONMENT="unt"
              ;;
            master)
              ENVIRONMENT="prd"
              ;;
            release/*)
              ENVIRONMENT="uat"
              ;;
            *)
              echo "Unsupported branch: $BRANCH"
              exit 1
              ;;
          esac

          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "Resolved environment: $ENVIRONMENT"


  test:
    name: Test application
    runs-on: ubuntu-latest
    needs: set-environment
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        env:
          NEXT_PUBLIC_BASE_PATH: ''
        run: npm test

      - name: Phase 2B tests
        env:
          NEXT_PUBLIC_BASE_PATH: ''
        run: npm run test:phase2b


  build:
    name: Build deployment artifact

    # Only create the real deployment artifact after merge/push
    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    needs:
      - set-environment
      - test

    environment: ${{ needs.set-environment.outputs.environment }}

    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Render invitation configuration
        env:
          EVENT_TIMEZONE: ${{ vars.EVENT_TIMEZONE }}
          EVENT_TIMEZONE_OFFSET: ${{ vars.EVENT_TIMEZONE_OFFSET }}
          EVENT_START_DATE: ${{ vars.EVENT_START_DATE }}
          EVENT_START_TIME: ${{ vars.EVENT_START_TIME }}
          GOOGLE_MAPS_URL: ${{ vars.GOOGLE_MAPS_URL }}
          VENUE_NAME: ${{ vars.VENUE_NAME }}
          VENUE_ADDRESS: ${{ vars.VENUE_ADDRESS }}
          GROOM_NAME: ${{ vars.GROOM_NAME }}
          BRIDE_NAME: ${{ vars.BRIDE_NAME }}
          GROOM_FATHER_NAME: ${{ vars.GROOM_FATHER_NAME }}
          GROOM_MOTHER_NAME: ${{ vars.GROOM_MOTHER_NAME }}
          BRIDE_FATHER_NAME: ${{ vars.BRIDE_FATHER_NAME }}
          BRIDE_MOTHER_NAME: ${{ vars.BRIDE_MOTHER_NAME }}
          GROOM_FAMILY_CONTACT_NAME: ${{ vars.GROOM_FAMILY_CONTACT_NAME }}
          GROOM_FAMILY_PHONE_NUMBER: ${{ vars.GROOM_FAMILY_PHONE_NUMBER }}
          BRIDE_FAMILY_CONTACT_NAME: ${{ vars.BRIDE_FAMILY_CONTACT_NAME }}
          BRIDE_FAMILY_PHONE_NUMBER: ${{ vars.BRIDE_FAMILY_PHONE_NUMBER }}
        run: npm run config:render

      - name: Build static export
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Validate static export
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run validate:export

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages-${{ github.sha }}
          path: out/
          retention-days: 1
          if-no-files-found: error
