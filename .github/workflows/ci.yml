name: CI

on:
  pull_request:
    branches:
      - development
      - master
      - release/**

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  set-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - name: Check branch name and set environment variable
        id: set-env
        run: |
          if [[ "${{ github.base_ref }}" == "development" ]]; then
            echo "environment=unt" >> $GITHUB_OUTPUT
          elif [[ "${{ github.base_ref }}" == "master" ]]; then
            echo "environment=prd" >> $GITHUB_OUTPUT
          elif [[ "${{ github.base_ref }}" == "release/**" ]]; then
            echo "environment=uat" >> $GITHUB_OUTPUT
          else
            echo "This workflow only runs on development, master, or release branches."
            exit 1
          fi
        
      - name: Display environment variable
        run: echo "Environment variable is set to ${{ steps.set-env.outputs.environment }}"
        
  test-build:
    name: Tests and GitHub Pages-compatible build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: set-environment
    environment: ${{ needs.set-environment.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        env:
          NEXT_PUBLIC_BASE_PATH: ''
        run: npm test

      - name: Phase 2B tests
        env:
          NEXT_PUBLIC_BASE_PATH: ''
        run: npm run test:phase2b

      # CI uses neutral fixture values only to prove that the deployment template
      # can be rendered and exported. Production values come from environment vars.
      - name: Render CI invitation configuration
        env:
          EVENT_TIMEZONE: ${{ vars.EVENT_TIMEZONE }}
          EVENT_TIMEZONE_OFFSET: ${{ vars.EVENT_TIMEZONE_OFFSET }}
          EVENT_START_DATE: ${{ vars.EVENT_START_DATE }}
          EVENT_START_TIME: ${{ vars.EVENT_START_TIME }}
          GOOGLE_MAPS_URL: ${{ vars.GOOGLE_MAPS_URL }}
          VENUE_NAME: ${{ vars.VENUE_NAME }}
          VENUE_ADDRESS: ${{ vars.VENUE_ADDRESS }}
          GROOM_NAME: ${{ vars.GROOM_NAME }}
          BRIDE_NAME: ${{ vars.BRIDE_NAME }}
          GROOM_FATHER_NAME: ${{ vars.GROOM_FATHER_NAME }}
          GROOM_MOTHER_NAME: ${{ vars.GROOM_MOTHER_NAME }}
          BRIDE_FATHER_NAME: ${{ vars.BRIDE_FATHER_NAME }}
          BRIDE_MOTHER_NAME: ${{ vars.BRIDE_MOTHER_NAME }}
          GROOM_FAMILY_CONTACT_NAME: ${{ vars.GROOM_FAMILY_CONTACT_NAME }}
          GROOM_FAMILY_PHONE_NUMBER: ${{ vars.GROOM_FAMILY_PHONE_NUMBER }}
          BRIDE_FAMILY_CONTACT_NAME: ${{ vars.BRIDE_FAMILY_CONTACT_NAME }}
          BRIDE_FAMILY_PHONE_NUMBER: ${{ vars.BRIDE_FAMILY_PHONE_NUMBER }}
        run: npm run config:render

      - name: Build GitHub Pages-compatible static export
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Validate GitHub Pages-compatible export
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run validate:export

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: out/
          if-no-files-found: error
