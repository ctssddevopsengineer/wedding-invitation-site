name: Deploy GitHub Pages

on:
  push:
    branches:
      - development
      - master
    # A workflow run is created only when the diff contains at least one
    # runtime/test-relevant file. An empty PR diff therefore creates no CI run.
    paths:
      - '**'
      - '!.github/workflows/**'
      - '!docs/**'
      - '!README.md'
      - '!AGENTS.md'
      - '!CLAUDE.md'
      - '!INSTALL.md'
      - '!.gitignore'

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-versions:
    name: Resolve deployment versions
    runs-on: ubuntu-latest
    outputs:
      current_deployed_version: ${{ steps.versions.outputs.current_deployed_version }}
      previous_deployed_version: ${{ steps.versions.outputs.previous_deployed_version }}
    steps:
      - name: Resolve current and previous deployed commit
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_SHA="${GITHUB_SHA}"
          PREVIOUS_SHA="$(
            gh api               --method GET               "repos/${GITHUB_REPOSITORY}/actions/workflows/cd.yml/runs"               -f branch="${GITHUB_REF_NAME}"               -f event="push"               -f status="success"               -f per_page=1               --jq '.workflow_runs[0].head_sha // ""'
          )"

          if [[ -z "${PREVIOUS_SHA}" ]]; then
            PREVIOUS_SHA="none"
          fi

          echo "current_deployed_version=${CURRENT_SHA}" >> "${GITHUB_OUTPUT}"
          echo "previous_deployed_version=${PREVIOUS_SHA}" >> "${GITHUB_OUTPUT}"

          {
            echo "### Deployment versions"
            echo ""
            echo "- Target branch: \`${GITHUB_REF_NAME}\`"
            echo "- CURRENT_DEPLOYED_VERSION: \`${CURRENT_SHA}\`"
            echo "- PREVIOUS_DEPLOYED_VERSION: \`${PREVIOUS_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  set-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - name: Check branch name and set environment variable
        id: set-env
        run: |
          if [[ "${{ github.ref_name }}" == "development" ]]; then
            echo "environment=unt" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == "master" ]]; then
            echo "environment=prd" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == release/** ]]; then
            echo "environment=uat" >> $GITHUB_OUTPUT
          else
            echo "This workflow only runs on development, master, or release branches."
            exit 1
          fi
        
      - name: Display environment variable
        run: echo "Environment variable is set to ${{ steps.set-env.outputs.environment }}"
  
  build:
    name: Build GitHub Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - set-environment
      - deployment-versions
    environment: ${{ needs.set-environment.outputs.environment }}
    env:
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      CURRENT_DEPLOYED_VERSION: ${{ needs.deployment-versions.outputs.current_deployed_version }}
      PREVIOUS_DEPLOYED_VERSION: ${{ needs.deployment-versions.outputs.previous_deployed_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6
        with:
          static_site_generator: next

      - name: Install dependencies
        run: npm ci

      - name: Render invitation configuration
        env:
          EVENT_TIMEZONE: ${{ vars.EVENT_TIMEZONE }}
          EVENT_TIMEZONE_OFFSET: ${{ vars.EVENT_TIMEZONE_OFFSET }}
          EVENT_START_DATE: ${{ vars.EVENT_START_DATE }}
          EVENT_START_TIME: ${{ vars.EVENT_START_TIME }}
          GOOGLE_MAPS_URL: ${{ vars.GOOGLE_MAPS_URL }}
          VENUE_NAME: ${{ vars.VENUE_NAME }}
          VENUE_ADDRESS: ${{ vars.VENUE_ADDRESS }}
          GROOM_NAME: ${{ vars.GROOM_NAME }}
          GROOM_NAME_BN: ${{ vars.GROOM_NAME_BN }}
          GROOM_NAME_NE: ${{ vars.GROOM_NAME_NE }}
          BRIDE_NAME: ${{ vars.BRIDE_NAME }}
          BRIDE_NAME_BN: ${{ vars.BRIDE_NAME_BN }}
          BRIDE_NAME_NE: ${{ vars.BRIDE_NAME_NE }}
          GROOM_FATHER_NAME: ${{ vars.GROOM_FATHER_NAME }}
          GROOM_MOTHER_NAME: ${{ vars.GROOM_MOTHER_NAME }}
          BRIDE_FATHER_NAME: ${{ vars.BRIDE_FATHER_NAME }}
          BRIDE_MOTHER_NAME: ${{ vars.BRIDE_MOTHER_NAME }}
          GROOM_FAMILY_CONTACT_NAME: ${{ vars.GROOM_FAMILY_CONTACT_NAME }}
          GROOM_FAMILY_PHONE_NUMBER: ${{ vars.GROOM_FAMILY_PHONE_NUMBER }}
          BRIDE_FAMILY_CONTACT_NAME: ${{ vars.BRIDE_FAMILY_CONTACT_NAME }}
          BRIDE_FAMILY_PHONE_NUMBER: ${{ vars.BRIDE_FAMILY_PHONE_NUMBER }}
        run: npm run config:render

      - name: Build static export
        run: npm run build

      - name: Validate GitHub Pages-compatible export
        run: npm run validate:export

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    name: Deploy GitHub Pages
    environment:
      name: github-pages
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ # ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs:
      - build
      - deployment-versions
    env:
      CURRENT_DEPLOYED_VERSION: ${{ needs.deployment-versions.outputs.current_deployed_version }}
      PREVIOUS_DEPLOYED_VERSION: ${{ needs.deployment-versions.outputs.previous_deployed_version }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Record deployed versions
        shell: bash
        run: |
          {
            echo "### Successful deployment"
            echo ""
            echo "- CURRENT_DEPLOYED_VERSION: \`${CURRENT_DEPLOYED_VERSION}\`"
            echo "- PREVIOUS_DEPLOYED_VERSION: \`${PREVIOUS_DEPLOYED_VERSION}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
